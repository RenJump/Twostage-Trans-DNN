[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twostage-transfer-learning"
version = "0.1.0"
description = "A small PyTorch implementation of two-stage transfer learning for grouped data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
